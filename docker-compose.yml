name: food-discovery-platform

services:
  postgres:
    build:
      context: .
      dockerfile: database/docker/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_app}
      POSTGRES_USER: ${POSTGRES_USER:-food_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - '${POSTGRES_BIND:-127.0.0.1:5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-food_app}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-food_app}}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      AUTH_API_ORIGIN: ${AUTH_API_ORIGIN:-http://localhost:3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-replace-with-a-local-secret}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/v1/auth/google/callback}
      AUTH_EXPOSE_VERIFICATION_LINK: ${AUTH_EXPOSE_VERIFICATION_LINK:-false}
      AUTH_EXPOSE_RESET_LINK: ${AUTH_EXPOSE_RESET_LINK:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-15000}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - '${BACKEND_BIND:-127.0.0.1:3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_BIND:-127.0.0.1:6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  crawler:
    profiles: [production]
    build:
      context: .
      dockerfile: crawler/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-food_app}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-food_app}}
      CRAWL_CITY: ${CRAWL_CITY:-Ho Chi Minh City}
      CRAWL_DISTRICTS: ${CRAWL_DISTRICTS:-}
      CRAWL_LIMIT_PER_QUERY: ${CRAWL_LIMIT_PER_QUERY:-10}
      CRAWL_MAX_QUERIES: ${CRAWL_MAX_QUERIES:-500}
      CRAWL_MAX_SCROLL_ATTEMPTS: ${CRAWL_MAX_SCROLL_ATTEMPTS:-20}
      CRAWL_MAX_REVIEWS_PER_PLACE: ${CRAWL_MAX_REVIEWS_PER_PLACE:-20}
      CRAWL_HEADLESS: ${CRAWL_HEADLESS:-true}
      CRAWL_HEARTBEAT_SECONDS: ${CRAWL_HEARTBEAT_SECONDS:-30}
      CRAWL_DELAY_MS: ${CRAWL_DELAY_MS:-2500}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-2}
      CRAWL_BROWSER_RESTART_EVERY: ${CRAWL_BROWSER_RESTART_EVERY:-150}
      REVIEW_REFRESH_THRESHOLD: ${REVIEW_REFRESH_THRESHOLD:-20}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_VISION_MODEL: ${AI_VISION_MODEL}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  frontend:
    profiles: [production]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - '${FRONTEND_BIND:-127.0.0.1:8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '--quiet', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
